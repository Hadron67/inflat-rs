[package]
name = "pyinflat"
version = "0.1.0"
edition = "2024"

[lib]
name = "pyinflat"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
inflat = { version = "0.1.0", path = "../inflat" }
numpy = "0.29.0"
pyo3 = { version = "0.29.0", features = ["extension-module"] }

[build-dependencies]
pyo3-build-config = "0.29.0"
